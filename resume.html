<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Resume | Neel</title>
<meta name="theme-color" content="#05070b">
<link rel="stylesheet" href="style.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
<div class="ambient one"></div><div class="ambient two"></div>
<main class="detail-page resume-detail-page">
  <div class="detail-top">
    <div>
      <div class="detail-kicker">Portfolio / Resume</div>
      <h1 class="detail-title">My <span>Resume.</span></h1>
      <p class="detail-description">A concise overview of my education, skills, experience, achievements and current direction.</p>
    </div>
    <a class="btn btn-outline detail-back" href="index.html">← Back to main page</a>
  </div>
  <div class="resume-frame-wrap">
    <div class="resume-frame-label"><span>RESUME / 01</span><span>FORMAL PROFILE</span></div>
    <div class="resume-frame">
      <img class="resume-image" src="resume.png" alt="Solapuri Neel Dineshkumar resume" onerror="this.style.display='none';document.getElementById('resumeFallback').style.display='block'">
      <div id="resumeFallback" class="coming-soon" style="display:none"><div class="coming-icon">⌁</div><h2>Resume coming soon.</h2><p>Add your resume image as <strong>resume.png</strong> in the portfolio root.</p></div>
    </div>
  </div>
  <div class="detail-actions">
    <a class="btn btn-primary" href="resume.png" download="Solapuri_Neel_Dineshkumar_Resume.png">Download resume ↓</a>
    <a class="btn btn-outline" href="index.html">← Back to main page</a>
  </div>
</main>
</body>
</html>
